pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'grand-atlas'

include 'mc1211'

// Grand Atlas: Myths & Legends, the add-on (docs/MYTHS_AND_LEGENDS.md). Its own jar, built from myths/.
include 'myths'
