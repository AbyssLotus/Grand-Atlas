# ─────────────────────────────────────────────────────────────────────────────
# Grand Atlas: Myths & Legends — the add-on's own settings.
#
# WHAT THIS FILE IS
#   Gradle reads `gradle.properties` files as simple key=value settings. There is
#   one at the repo root (Grand Atlas's) and this one, inside myths/. When Gradle
#   builds the `myths` project, a key written here REPLACES the root's key of the
#   same name. That's how the add-on gets its own mod id, name and version while
#   still sharing the root's other settings (memory size, caching, and so on).
#
#   These values are read by myths/build.gradle and copied into
#   neoforge.mods.toml (see myths/src/main/templates/META-INF/), so each one is
#   written in exactly one place and can't drift out of sync.
# ─────────────────────────────────────────────────────────────────────────────

# The MOD ID is the add-on's permanent internal name. Minecraft uses it as the
# "namespace" in every id the mod adds: grandatlas_myths:labyrinth_stone,
# grandatlas_myths:labyrinth (the dimension), and so on. Rules: lowercase letters,
# digits and underscores only, 2–64 characters. Never change it after release:
# worlds store blocks and items by these ids, and renaming them breaks saves.
mod_id=grandatlas_myths

# The name players see in the mod list. This one can hold spaces and "&".
mod_name=Grand Atlas: Myths & Legends

# Version numbers follow MAJOR.MINOR.PATCH. 0.x means "not released yet".
mod_version=0.1.0

# The Java package everything lives under. By convention it's a reversed domain
# name plus the mod's name, so it can't collide with another mod's classes.
mod_group_id=com.seaweed.grandatlas.myths

mod_description=Myths made real on top of Grand Atlas. First: the Labyrinth, an endless maze you can fall into while mining.
