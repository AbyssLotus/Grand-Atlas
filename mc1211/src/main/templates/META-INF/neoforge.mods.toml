modLoader = "javafml"
loaderVersion = "[4,)"
license = "Grand Atlas License 1.0 (noncommercial) - https://github.com/AbyssLotus/Grand-Atlas/blob/main/LICENSE.md"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.compat.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "grandatlas_logo.png"
authors = "${mod_authors}"
credits = "Hand-built trees and rock formations by H2CO3 (1k - Treepack), Plutouthere (The God Tree-Pack) and Dannypan (Landscaping Mega Schematic Pack, with trees by paleozoey), used under their published terms. See GRAND_ATLAS_CREDITS.md."
displayURL = "https://github.com/AbyssLotus/Grand-Atlas"
issueTrackerURL = "https://github.com/AbyssLotus/Grand-Atlas/issues"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Grand Atlas owns the overworld's dimension, dimension type and noise settings.
# These mods override the same files, so only one of them can win.
[[dependencies.${mod_id}]]
modId = "tectonic"
type = "incompatible"
reason = "Grand Atlas replaces Tectonic's terrain. Remove Tectonic."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "terralith"
type = "incompatible"
reason = "Grand Atlas replaces Terralith's terrain and biomes. Remove Terralith (and Terralith ReStoned)."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "pandorawilds"
type = "incompatible"
reason = "Pandora Wilds' biomes can't generate in a Grand Atlas world. Remove it; it's planned to join Grand Atlas in a later version."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
