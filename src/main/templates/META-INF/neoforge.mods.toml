modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Grand Atlas owns the overworld's dimension, dimension type and noise settings.
# These mods override the same files, so only one of them can win.
[[dependencies.${mod_id}]]
modId = "tectonic"
type = "incompatible"
reason = "Grand Atlas replaces Tectonic's terrain. Remove Tectonic."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "terralith"
type = "incompatible"
reason = "Grand Atlas replaces Terralith's terrain and biomes. Remove Terralith (and Terralith ReStoned)."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "pandorawilds"
type = "incompatible"
reason = "Pandora Wilds is folded into Grand Atlas. Remove the separate Pandora Wilds jar."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
